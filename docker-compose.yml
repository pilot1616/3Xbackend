services:
  mysql:
    image: mysql:8.4
    container_name: 3xbackend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-3X}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3xbackend-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      DATABASE_MYSQL_USER: ${DATABASE_MYSQL_USER:-root}
      DATABASE_MYSQL_PASSWORD: ${DATABASE_MYSQL_PASSWORD:-root}
      DATABASE_MYSQL_ADDRESS: mysql
      DATABASE_MYSQL_PORT: 3306
      DATABASE_MYSQL_SCHEMA: ${DATABASE_MYSQL_SCHEMA:-3X}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8010}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./public:/app/public

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: 3xbackend-agent
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: ${AGENT_PORT:-8010}
      DATABASE_MYSQL_USER: ${DATABASE_MYSQL_USER:-root}
      DATABASE_MYSQL_PASSWORD: ${DATABASE_MYSQL_PASSWORD:-root}
      DATABASE_MYSQL_ADDRESS: mysql
      DATABASE_MYSQL_PORT: 3306
      DATABASE_MYSQL_SCHEMA: ${DATABASE_MYSQL_SCHEMA:-3X}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai-api-gateway.app.baizhi.cloud/api/openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-dev/gpt-5.5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      AGENT_ALLOWED_TABLES: ${AGENT_ALLOWED_TABLES:-}
      AGENT_SAMPLE_ROW_LIMIT: ${AGENT_SAMPLE_ROW_LIMIT:-5}
    ports:
      - "${AGENT_PORT:-8010}:8010"

  data-fetch:
    build:
      context: ./data-fetch
      dockerfile: Dockerfile
    container_name: 3xbackend-data-fetch
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_MYSQL_USER: ${DATABASE_MYSQL_USER:-root}
      DATABASE_MYSQL_PASSWORD: ${DATABASE_MYSQL_PASSWORD:-root}
      DATABASE_MYSQL_ADDRESS: mysql
      DATABASE_MYSQL_PORT: 3306
      DATABASE_MYSQL_SCHEMA: ${DATABASE_MYSQL_SCHEMA:-3X}
      DATA_FETCH_INTERVAL_SECONDS: ${DATA_FETCH_INTERVAL_SECONDS:-3600}
    command: ["python", "-m", "app.main", "loop"]

volumes:
  mysql-data:
