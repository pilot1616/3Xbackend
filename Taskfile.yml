version: '3'

dotenv:
  - .env

tasks:
  init:
    desc: 初始化本地开发环境
    cmds:
      - mkdir -p public/images public/uploads
      - sh -c '[ -f .env ] || cp .env.example .env'
      - sh -c '[ -f front/.env ] || cp front/.env.example front/.env'
      - sh -c '[ -f agent/.env ] || cp agent/.env.example agent/.env'
      - sh -c '[ -f data-fetch/.env ] || cp data-fetch/.env.example data-fetch/.env'
      - cd front && npm install

  db:up:
    desc: 启动本地 MySQL 容器
    cmds:
      - docker compose up -d mysql

  db:wait:
    desc: 等待本地 MySQL 容器就绪
    cmds:
      - |
        sh -c 'for i in $(seq 1 60); do \
        if docker exec 3xbackend-mysql mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD:-root}" --silent >/dev/null 2>&1; then \
          echo "mysql is ready"; \
          exit 0; \
        fi; \
        sleep 2; \
        done; \
        echo "mysql did not become ready in time"; \
        exit 1'

  db:down:
    desc: 关闭本地 MySQL 容器
    cmds:
      - docker compose stop mysql

  compose:up:
    desc: 启动完整 Docker Compose 环境
    deps: [init]
    cmds:
      - docker compose up -d --build

  compose:down:
    desc: 关闭完整 Docker Compose 环境
    cmds:
      - docker compose down

  backend:
    desc: 直接本地运行后端（go run）
    deps: [init]
    cmds:
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd

  backend:docker:
    desc: 启动 Docker MySQL 后再本地运行后端
    deps: [init, db:up, db:wait]
    cmds:
      - task backend

  frontend:
    desc: 直接本地运行前端开发服务
    deps: [init]
    dir: front
    cmds:
      - npm run dev -- --host 0.0.0.0

  dev:
    desc: 本地联调，直接运行后端和前端（不编译）
    deps: [init]
    cmds:
      - |
        sh -c 'trap "kill 0" EXIT INT TERM; \
        ( SERVER_PORT="${SERVER_PORT:-3000}" \
          DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
          DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
          DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
          DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
          DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
          AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
          go run ./cmd ) & \
        ( cd agent && \
          [ -f .env ] && set -a && . ./.env && set +a || true; \
          PYTHON_BIN="./.venv/bin/python"; \
          [ -x "$PYTHON_BIN" ] || PYTHON_BIN="python3"; \
          "$PYTHON_BIN" -m uvicorn app.main:app --host "${AGENT_HOST:-0.0.0.0}" --port "${AGENT_PORT:-8010}" ) & \
        ( cd front && npm run dev -- --host 0.0.0.0 )'

  dev:docker:
    desc: 启动 Docker MySQL 后进行本地前后端联调
    deps: [init, db:up, db:wait]
    cmds:
      - task dev

  build:
    desc: 本地检查 Go 和前端构建
    cmds:
      - go build ./...
      - cd front && npm run build

  test:backend:
    desc: 运行 Go 后端测试（使用项目内 Go cache）
    cmds:
      - mkdir -p .cache/go-build
      - GOCACHE=$(pwd)/.cache/go-build go test ./...

  seed:
    desc: 注入一批论坛假数据和演示图片
    deps: [init]
    cmds:
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd/seed

  seed:docker:
    desc: 启动 Docker MySQL 后注入假数据
    deps: [init, db:up, db:wait]
    cmds:
      - task seed

  metal:sync:
    desc: 手动执行一次贵金属数据同步
    deps: [init]
    cmds:
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd/metal-sync

  metal:sync:docker:
    desc: 启动 Docker MySQL 后手动执行一次贵金属数据同步
    deps: [init, db:up, db:wait]
    cmds:
      - task metal:sync

  tech:sync:
    desc: 手动执行一次 AI / 科技市场数据同步
    deps: [init]
    cmds:
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd/tech-market-sync

  tech:sync:docker:
    desc: 启动 Docker MySQL 后手动执行一次 AI / 科技市场数据同步
    deps: [init, db:up, db:wait]
    cmds:
      - task tech:sync

  data:fetch:
    desc: 使用 AkShare 拉取金融数据并写入数据库
    deps: [init]
    cmds:
      - |
        cd data-fetch && \
        [ -f .env ] && set -a && . ./.env && set +a || true; \
        python3 -m app.main once

  data:fetch:history:
    desc: 使用 AkShare 拉取历年金融数据并写入数据库
    deps: [init]
    cmds:
      - |
        cd data-fetch && \
        [ -f .env ] && set -a && . ./.env && set +a || true; \
        python3 -m app.main history

  data:fetch:docker:
    desc: 启动 Docker MySQL 后使用 AkShare 拉取金融数据
    deps: [init, db:up, db:wait]
    cmds:
      - task data:fetch

  startup:init:
    desc: 启动初始化：历年金融数据、AI 日报全量、随机用户数据
    deps: [init, db:up, db:wait]
    cmds:
      - task data:fetch:history
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        SYNC_AI_DAILY_MAX_ENTRIES="${SYNC_AI_DAILY_MAX_ENTRIES:-10000}" \
        go run ./cmd/ai-daily-sync
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd/seed \
          -users "${SEED_USERS:-80}" \
          -questions "${SEED_QUESTIONS:-120}" \
          -min-comments "${SEED_MIN_COMMENTS:-1}" \
          -max-comments "${SEED_MAX_COMMENTS:-8}" \
          -min-likes "${SEED_MIN_LIKES:-0}" \
          -max-likes "${SEED_MAX_LIKES:-20}" \
          -max-assets "${SEED_MAX_ASSETS:-4}"

  ai:daily:sync:
    desc: 手动执行一次 AI 日报同步
    deps: [init]
    cmds:
      - |
        SERVER_PORT="${SERVER_PORT:-3000}" \
        DATABASE_MYSQL_USER="${DATABASE_MYSQL_USER:-root}" \
        DATABASE_MYSQL_PASSWORD="${DATABASE_MYSQL_PASSWORD:-root}" \
        DATABASE_MYSQL_ADDRESS="${DATABASE_MYSQL_ADDRESS:-127.0.0.1}" \
        DATABASE_MYSQL_PORT="${DATABASE_MYSQL_PORT:-3306}" \
        DATABASE_MYSQL_SCHEMA="${DATABASE_MYSQL_SCHEMA:-3X}" \
        AUTH_SECRET="${AUTH_SECRET:-3Xbackend-dev-secret}" \
        go run ./cmd/ai-daily-sync

  ai:daily:sync:docker:
    desc: 启动 Docker MySQL 后手动执行一次 AI 日报同步
    deps: [init, db:up, db:wait]
    cmds:
      - task ai:daily:sync

  agent:
    desc: 运行 LangGraph AI Agent 服务
    deps: [init]
    cmds:
      - |
        cd agent && \
        [ -f .env ] && set -a && . ./.env && set +a || true; \
        PYTHON_BIN="./.venv/bin/python"; \
        [ -x "$PYTHON_BIN" ] || PYTHON_BIN="python3"; \
        "$PYTHON_BIN" -m uvicorn app.main:app --host "${AGENT_HOST:-0.0.0.0}" --port "${AGENT_PORT:-8010}"
